# 判据文件个数检查：脚本和清单都取 main 上的，PR 只提供改动路径清单和事件信息
name: judgefiles
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  judgefiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: 拿改动路径清单
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/$REPO/pulls/$NUM/files" > pages.json && jq -s "add // []" pages.json > changed.json
      - name: 检查判据文件个数
        env:
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          LABEL: ${{ github.event.label.name }}
          EXPECTED: ${{ github.event.pull_request.changed_files }}
        run: python base/scripts/check-judgefiles.py --vocab base/vocab.json --paths changed.json --expected-count "$EXPECTED" --action "$ACTION" --sender "$SENDER" --label "$LABEL"
